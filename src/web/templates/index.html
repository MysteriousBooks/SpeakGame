<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>崇祯模拟器 - 早朝</title>
    <script src="https://unpkg.com/htmx.org@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'SimSun', 'STSong', serif; background: #1a1a2e; color: #e0d5c1; min-height: 100vh; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; display: grid; grid-template-columns: 1fr 300px; gap: 20px; }
        .header { grid-column: 1/-1; text-align: center; padding: 15px; border-bottom: 1px solid #4a3f2e; }
        .header h1 { font-size: 1.5em; color: #c9a84c; }
        .header .era { color: #8a7a5a; font-size: 0.9em; }
        .panel { background: #16213e; border: 1px solid #2a3a5e; border-radius: 8px; padding: 15px; }
        .panel h2 { font-size: 1em; color: #c9a84c; margin-bottom: 10px; border-bottom: 1px solid #2a3a5e; padding-bottom: 5px; }
        .values { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px,1fr)); gap: 8px; }
        .value-item { background: #0f3460; padding: 8px; border-radius: 4px; text-align: center; }
        .value-item .label { font-size: 0.75em; color: #8a7a5a; }
        .value-item .num { font-size: 1.1em; color: #e0d5c1; font-weight: bold; }
        .edict-area { margin-top: 15px; }
        .edict-area textarea { width: 100%; height: 80px; background: #0f3460; border: 1px solid #2a3a5e; color: #e0d5c1; padding: 10px; border-radius: 4px; font-family: inherit; resize: vertical; }
        .edict-area button { margin-top: 8px; padding: 8px 24px; background: #c9a84c; color: #1a1a2e; border: none; border-radius: 4px; cursor: pointer; font-size: 1em; }
        .edict-area button:hover { background: #d4b85a; }
        .narrative { margin-top: 15px; padding: 10px; background: #0f3460; border-radius: 4px; min-height: 60px; white-space: pre-wrap; font-size: 0.9em; line-height: 1.6; }
        .events { margin-top: 10px; }
        .event-item { padding: 6px; background: #2a1a3e; border-left: 3px solid #c9a84c; margin-bottom: 5px; border-radius: 2px; font-size: 0.85em; }
        .btn-advance { margin-top: 10px; padding: 6px 16px; background: #2a3a5e; color: #e0d5c1; border: 1px solid #4a5a7e; border-radius: 4px; cursor: pointer; }
        .btn-advance:hover { background: #3a4a6e; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🏯 崇祯模拟器</h1>
        <div class="era" id="era">{{ era }}</div>
    </div>
    <div class="container">
        <div class="panel" style="grid-column:1">
            <h2>📜 国势</h2>
            <div class="values" id="values">
                {% for k, v in values.items() %}
                <div class="value-item">
                    <div class="label">{{ k }}</div>
                    <div class="num">{{ v }}</div>
                </div>
                {% endfor %}
                <div class="value-item">
                    <div class="label">太仓国库</div>
                    <div class="num">{{ treasury }}</div>
                </div>
                <div class="value-item">
                    <div class="label">内帑</div>
                    <div class="num">{{ inner_purse }}</div>
                </div>
            </div>

            <div class="edict-area">
                <h2>✍️ 下诏</h2>
                <textarea id="edictInput" placeholder="输入诏书...（如：拨银十万赈陕西）"></textarea>
                <button hx-post="/edict" hx-trigger="click" hx-target="#narrative" hx-include="#edictInput" hx-swap="innerHTML">下诏</button>
            </div>
            <div class="narrative" id="narrative">等待你的第一道诏书...</div>
        </div>

        <div class="panel" style="grid-column:2">
            <h2>⚡ 事件</h2>
            <div class="events" id="events">
                {% if events %}
                {% for e in events %}
                <div class="event-item">{{ e }}</div>
                {% endfor %}
                {% else %}
                <div class="event-item" style="color:#8a7a5a;">暂无活跃事件</div>
                {% endif %}
            </div>
            <button class="btn-advance" hx-post="/advance" hx-target="#narrative" hx-swap="innerHTML">推进一回合</button>
        </div>
    </div>
</body>
</html>
